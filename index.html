<title>Registro de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E2023;
    --surface:#26282B;
    --surface-2:#302F33;
    --pill-bg:#3D3F44;
    --border:#3B3D40;
    --text:#E7E6E3;
    --text-muted:#96989B;
    --accent:#D3A76B;
    --accent-text:#211D14;
    --positive:#8FAF8A;
    --negative:#C97B72;
    --cat-mercado:#8FAF8A;
    --cat-comida:#D08A3E;
    --cat-transporte:#7FA0C9;
    --cat-vivienda:#B8B5AE;
    --cat-entretenimiento:#B48FC9;
    --cat-salud:#C97B72;
    --cat-otro:#8A8D91;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:22px 14px 100px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
  .app{ width:100%; max-width:440px; }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:12px;
  }
  .month-nav{
    display:flex; align-items:center; gap:12px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-muted);
    margin-bottom:14px;
  }
  .month-nav button{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    width:26px;height:26px; color:var(--text); cursor:pointer; font-size:15px;
    display:flex;align-items:center;justify-content:center; line-height:1;
  }
  .month-nav button:hover{ border-color:var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .month-nav span{ text-transform:capitalize; }
  .month-nav select{
    background:none; border:none; color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace; font-size:16px; text-transform:capitalize;
    text-align:center; cursor:pointer; flex:1;
  }
  .month-nav select:hover{ color:var(--text); }
  .total-label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:3px; }
  .total-amount{
    display:block; font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:36px; letter-spacing:-0.3px; color:var(--text);
  }
  .balance-card .total-amount{ font-size:42px; }
  .links-row{ margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .text-link{
    display:inline-flex; align-items:center;
    background:var(--pill-bg); border:none; color:var(--text-muted);
    padding:6px 12px; border-radius:999px;
    cursor:pointer; font-family:'Inter',sans-serif; font-size:12.5px;
  }
  .text-link:hover{ background:var(--border); color:var(--text); }
  .budget-status{ display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  .budget-bar-track{ height:5px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .budget-bar-fill{ height:100%; background:var(--positive); }
  .budget-bar-fill.over{ background:var(--negative); }
  .budget-text{ font-size:12.5px; color:var(--text-muted); }
  .budget-text.over{ color:var(--negative); }

  .breakdown-item{ margin-bottom:12px; }
  .breakdown-item:last-child{ margin-bottom:0; }
  .breakdown-row{ display:flex; align-items:center; gap:9px; margin-bottom:5px; font-size:13px; }
  .cat-dot{ width:8px;height:8px;border-radius:50%;flex:none; }
  .breakdown-label{ flex:1; }
  .breakdown-pct{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-muted); }
  .breakdown-bar-track{ height:4px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
  .breakdown-bar-fill{ height:100%; }

  .controls-row{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .chip-scroll{
    display:flex; gap:6px; overflow-x:auto; flex:1; padding-bottom:2px;
    scrollbar-width:none;
  }
  .chip-scroll::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:none; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .filter-chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  select#sortSelect{
    flex:none; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:6px 8px; font-size:16px; font-family:'Inter',sans-serif;
  }

  .day-group{ margin-top:12px; }
  .day-group:first-child{ margin-top:0; }
  .day-heading{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:0.6px; margin-bottom:5px;
  }
  .entry-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px; border-bottom:1px solid var(--border); gap:10px;
    cursor:pointer; border-radius:8px;
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-row:active{ background:var(--surface-2); }
  .entry-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .entry-text{ min-width:0; }
  .entry-cat{ font-size:13.5px; }
  .entry-note{ font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  .entry-date-inline{ font-size:11px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; margin-top:1px; }
  .entry-right{ display:flex; align-items:center; gap:8px; flex:none; }
  .entry-amount{ font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; }
  .delete-btn{
    background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;
    width:24px;height:24px; border-radius:6px; display:flex;align-items:center;justify-content:center;
  }
  .delete-btn:hover{ color:var(--negative); background:var(--surface-2); }

  .empty-state{ text-align:center; padding:24px 10px 8px; color:var(--text-muted); font-size:13.5px; line-height:1.5; }

  .fab{
    position:fixed; bottom:26px; right:22px;
    width:56px;height:56px; border-radius:50%;
    background:var(--accent); color:var(--accent-text); font-size:28px; border:none; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center; line-height:1;
  }
  .fab:hover{ filter:brightness(1.08); }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(10,11,12,0.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:20;
  }
  .sheet-overlay[hidden]{ display:none; }
  #categoryOverlay{ z-index:21; }
  .sheet{
    width:100%; max-width:440px; background:var(--surface);
    border:1px solid var(--border); border-bottom:none;
    border-radius:20px 20px 0 0; padding:14px 20px 22px;
    display:flex; flex-direction:column; gap:13px;
  }
  .sheet.small{ border-radius:20px; border-bottom:1px solid var(--border); margin:auto; }
  .sheet-handle{
    width:36px;height:4px;background:var(--border); border-radius:2px; margin:0 auto 2px;
    position:relative; cursor:grab; touch-action:none;
  }
  .sheet-handle::before{
    content:''; position:absolute; top:-14px; left:-24px; right:-24px; bottom:-14px;
  }
  .sheet-handle:active{ cursor:grabbing; background:var(--text-muted); }
  .sheet-title{ font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; color:var(--text); }
  .sheet label{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-muted); }
  .sheet input{
    font-family:'IBM Plex Mono',monospace; font-size:16px; padding:10px 12px;
    border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text);
  }
  .sheet input#noteInput{ font-family:'Inter',sans-serif; font-size:16px; }
  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:20px; padding:7px 13px; font-size:12.5px; cursor:pointer;
  }
  .chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .chip.add-chip{ border-style:dashed; color:var(--text-muted); background:transparent; }
  .chip.add-chip:hover{ color:var(--text); border-color:var(--text); }
  .sheet-actions{ display:flex; gap:10px; margin-top:2px; }
  .sheet-actions button{
    flex:1; padding:12px; border-radius:10px; border:1px solid var(--border);
    font-size:14px; font-weight:500; cursor:pointer; background:var(--surface-2); color:var(--text);
  }
  .sheet-actions button[type="submit"]{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .delete-link{
    background:none; border:none; color:var(--negative); text-decoration:underline;
    text-decoration-style:dotted; cursor:pointer; font-size:12.5px; padding:0; align-self:flex-start;
  }

  .manage-list{ display:flex; flex-direction:column; max-height:50vh; overflow-y:auto; }
  .manage-row{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border); font-size:13.5px; }
  .manage-row:last-child{ border-bottom:none; }
  .manage-label{ flex:1; }
  .manage-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:10px; font-size:13px; z-index:30;
  }
  .undo-pill{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:8px 8px 8px 18px; border-radius:999px; font-size:13px; z-index:35;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  .undo-pill[hidden]{ display:none; }
  #undoAction{ font-weight:600; color:var(--accent); cursor:pointer; }
  #undoCloseBtn{
    background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px;
    width:22px;height:22px; border-radius:50%; display:flex;align-items:center;justify-content:center;
  }
  #undoCloseBtn:hover{ background:var(--border); color:var(--text); }
  .chart-wrap{ margin-bottom:14px; }
  .chart-label{
    font-size:10.5px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:0.6px; margin-bottom:6px; font-family:'IBM Plex Mono',monospace;
  }
  .daily-chart-svg{ width:100%; height:76px; display:block; }
  .chart-bar-label{ font-family:'IBM Plex Mono',monospace; font-size:9px; fill:var(--text-muted); }
  .chart-legend{ margin-top:10px; }

  .dues-section{ margin-bottom:14px; }
  .dues-section:last-child{ margin-bottom:0; }
  .dues-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .dues-title{
    display:inline-flex; align-items:center;
    font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    font-family:'IBM Plex Mono',monospace; padding:4px 12px; border-radius:999px;
  }
  .dues-title.receivable{ background:var(--positive); color:var(--accent-text); }
  .dues-title.payable{ background:var(--negative); color:var(--accent-text); }
  .dues-total{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; }
  .due-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); gap:10px; }
  .due-row:last-child{ border-bottom:none; }
  .due-left{ min-width:0; }
  .due-desc{ font-size:13.5px; }
  .due-person{ font-size:11.5px; color:var(--text-muted); }
  .due-right{ display:flex; align-items:center; gap:6px; flex:none; }
  .due-amount{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; }
  .due-check{
    background:none; border:1px solid var(--border); color:var(--positive); cursor:pointer;
    font-size:12px; width:22px;height:22px; border-radius:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .due-check:hover{ border-color:var(--positive); }
  .dues-empty{ font-size:12.5px; color:var(--text-muted); padding:2px 0 6px; }
  .dues-history{ margin-top:10px; }
  .dues-history summary{
    display:inline-flex; align-items:center; list-style:none; cursor:pointer;
    font-size:12.5px; color:var(--text-muted);
    background:var(--pill-bg); padding:6px 12px; border-radius:999px;
  }
  .dues-history summary::-webkit-details-marker{ display:none; }
  .dues-history summary:hover{ background:var(--border); color:var(--text); }
  .dues-history[open] summary{ margin-bottom:8px; }
  .muted-strike{ color:var(--text-muted); text-decoration:line-through; }
</style>
</head>
<body>

<div class="app">
  <header class="card balance-card">
    <span class="total-label">Saldo disponible</span>
    <span class="total-amount" id="balanceAmount">—</span>
    <div class="links-row">
      <button class="text-link" id="addBalanceLink">+ Añadir</button>
      <button class="text-link" id="balanceLink">Actualizar</button>
    </div>
  </header>

  <header class="card">
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mes anterior">‹</button>
      <select id="monthSelect" aria-label="Seleccionar mes"></select>
      <button id="nextMonth" aria-label="Mes siguiente">›</button>
    </div>
    <span class="total-label">Gastado este mes</span>
    <span class="total-amount" id="totalAmount">$0</span>
    <div id="budgetStatusWrap"></div>
    <div class="links-row">
      <button class="text-link" id="budgetLink">Meta mensual</button>
      <button class="text-link" id="manageCategoriesLink">Gestionar categorías</button>
    </div>
  </header>

  <section class="card">
    <div class="dues-section">
      <div class="dues-header">
        <span class="dues-title receivable">Por cobrar</span>
        <span class="dues-total" id="receivableTotal" style="color:var(--positive)">$0</span>
      </div>
      <div id="receivableList"></div>
      <button type="button" class="text-link" id="addReceivableBtn">+ Agregar</button>
      <details class="dues-history">
        <summary id="receivableHistorySummary">Historial (0)</summary>
        <div id="receivableHistory"></div>
      </details>
    </div>
    <div class="dues-section">
      <div class="dues-header">
        <span class="dues-title payable">Por pagar</span>
        <span class="dues-total" id="payableTotal" style="color:var(--negative)">$0</span>
      </div>
      <div id="payableList"></div>
      <button type="button" class="text-link" id="addPayableBtn">+ Agregar</button>
      <details class="dues-history">
        <summary id="payableHistorySummary">Historial (0)</summary>
        <div id="payableHistory"></div>
      </details>
    </div>
  </section>

  <section class="card">
    <div id="categoryChart" class="chart-wrap"></div>
    <div class="controls-row">
      <div class="chip-scroll" id="filterChips"></div>
      <select id="sortSelect" aria-label="Ordenar por">
        <option value="date-desc">Recientes</option>
        <option value="date-asc">Antiguos</option>
        <option value="amount-desc">Monto ↓</option>
        <option value="amount-asc">Monto ↑</option>
      </select>
    </div>
    <div id="entriesList"></div>
    <div class="empty-state" id="emptyState" hidden>
      No hay gastos que coincidan.<br>Toca + para anotar uno.
    </div>
  </section>
</div>

<button class="fab" id="addBtn" aria-label="Agregar gasto">+</button>

<div class="sheet-overlay" id="sheetOverlay" hidden>
  <form class="sheet" id="entryForm">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Nuevo gasto</div>
    <label>Monto (COP)
      <input type="text" id="amountInput" inputmode="numeric" placeholder="0" required>
    </label>
    <label>Categoría
      <div class="chip-group" id="categoryChips"></div>
    </label>
    <label>Nota (opcional)
      <input type="text" id="noteInput" placeholder="Ej: Mercado Éxito" maxlength="60">
    </label>
    <label>Fecha
      <input type="date" id="dateInput" required>
    </label>
    <button type="button" class="delete-link" id="deleteEntryBtn" hidden>Eliminar este gasto</button>
    <div class="sheet-actions">
      <button type="button" id="cancelBtn">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</div>

<div class="sheet-overlay" id="budgetOverlay" hidden>
  <form class="sheet small" id="budgetForm">
    <label>Meta mensual (COP) — opcional
      <input type="text" id="budgetInput" inputmode="numeric" placeholder="Ej: 1.500.000">
    </label>
    <div class="sheet-actions">
      <button type="button" id="budgetCancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</div>

<div class="sheet-overlay" id="balanceOverlay" hidden>
  <form class="sheet small" id="balanceForm">
    <label>¿Cuánto dinero tienes disponible ahora?
      <input type="text" id="balanceInput" inputmode="numeric" placeholder="Ej: 2.000.000">
    </label>
    <div class="sheet-actions">
      <button type="button" id="balanceCancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</div>

<div class="sheet-overlay" id="addBalanceOverlay" hidden>
  <form class="sheet small" id="addBalanceForm">
    <div class="sheet-title">Añadir al saldo</div>
    <label>¿Cuánto dinero recibiste?
      <input type="text" id="addBalanceInput" inputmode="numeric" placeholder="Ej: 500.000" required>
    </label>
    <div class="sheet-actions">
      <button type="button" id="addBalanceCancel">Cancelar</button>
      <button type="submit">Añadir</button>
    </div>
  </form>
</div>

<div class="sheet-overlay" id="categoryOverlay" hidden>
  <form class="sheet small" id="categoryForm">
    <label>Nombre de la categoría
      <input type="text" id="categoryNameInput" placeholder="Ej: Gimnasio" maxlength="24" required>
    </label>
    <div class="sheet-actions">
      <button type="button" id="categoryCancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</div>

<div class="sheet-overlay" id="manageCategoriesOverlay" hidden>
  <div class="sheet" id="manageCategoriesSheet">
    <div class="sheet-handle"></div>
    <div id="manageCategoriesList" class="manage-list"></div>
    <div class="sheet-actions">
      <button type="button" id="manageAddCategory">+ Nueva categoría</button>
      <button type="button" id="manageCategoriesClose">Cerrar</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="dueOverlay" hidden>
  <form class="sheet small" id="dueForm">
    <div class="sheet-title" id="dueSheetTitle">Nueva cuenta</div>
    <label>Descripción
      <input type="text" id="dueDescInput" placeholder="Ej: Préstamo a Juan" maxlength="60" required>
    </label>
    <label>Monto (COP)
      <input type="text" id="dueAmountInput" inputmode="numeric" placeholder="0" required>
    </label>
    <label>Persona (opcional)
      <input type="text" id="duePersonInput" placeholder="Ej: Juan" maxlength="40">
    </label>
    <div class="sheet-actions">
      <button type="button" id="dueCancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<div class="undo-pill" id="undoPill" hidden>
  <span id="undoAction">Deshacer</span>
  <button id="undoCloseBtn" type="button" aria-label="Cerrar">×</button>
</div>

<script>
const CATEGORIES = [
  {id:'mercado', label:'Mercado', color:'var(--cat-mercado)'},
  {id:'comida', label:'Comida fuera', color:'var(--cat-comida)'},
  {id:'transporte', label:'Transporte', color:'var(--cat-transporte)'},
  {id:'vivienda', label:'Vivienda/servicios', color:'var(--cat-vivienda)'},
  {id:'entretenimiento', label:'Entretenimiento', color:'var(--cat-entretenimiento)'},
  {id:'salud', label:'Salud', color:'var(--cat-salud)'},
  {id:'otro', label:'Otro', color:'var(--cat-otro)'},
];
const STORAGE_KEY = 'gastos-data';
const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const CUSTOM_PALETTE = ['#8FAF8A','#7FA0C9','#B48FC9','#C97B72','#8A8D91','#6FA893','#9B7BC9','#C97BA0'];

let data = { entries: [], budget: null, customCategories: [], hiddenDefaultCategories: [], balance: null, balanceSetAt: null, receivables: [], payables: [] };
let selectedCategory = CATEGORIES[0].id;
let editingId = null;
let dueKind = 'receivable';
let sortMode = 'date-desc';
let filterCategory = 'all';
const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();

const fmt = new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 });

function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ return `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`; }
function allCategories(){
  const hidden = data.hiddenDefaultCategories || [];
  return CATEGORIES.filter(c => !hidden.includes(c.id)).concat(data.customCategories || []);
}
function catInfo(id){ const list = allCategories(); return list.find(c => c.id === id) || list[list.length-1]; }
function slugify(str){
  const base = str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
  let id = base || 'categoria';
  let n = 2;
  while(allCategories().some(c => c.id === id)){ id = `${base}-${n}`; n++; }
  return id;
}

function attachThousandsFormatting(input){
  input.addEventListener('input', () => {
    const raw = input.value.replace(/\D/g,'');
    input.value = raw ? Number(raw).toLocaleString('es-CO') : '';
  });
}
function rawNumber(input){
  const raw = input.value.replace(/\D/g,'');
  return raw ? parseInt(raw,10) : 0;
}
function rawNumberOrNull(input){
  const raw = input.value.replace(/\D/g,'');
  return raw ? parseInt(raw,10) : null;
}
function computeRemainingBalance(){
  if(data.balance == null) return null;
  const spent = data.entries
    .filter(e => !data.balanceSetAt || e.date >= data.balanceSetAt)
    .reduce((s,e) => s + e.amount, 0);
  return data.balance - spent;
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return {
        entries: Array.isArray(parsed.entries) ? parsed.entries : [],
        budget: parsed.budget ?? null,
        customCategories: Array.isArray(parsed.customCategories) ? parsed.customCategories : [],
        hiddenDefaultCategories: Array.isArray(parsed.hiddenDefaultCategories) ? parsed.hiddenDefaultCategories : [],
        balance: parsed.balance ?? null,
        balanceSetAt: parsed.balanceSetAt ?? null,
        receivables: Array.isArray(parsed.receivables) ? parsed.receivables : [],
        payables: Array.isArray(parsed.payables) ? parsed.payables : []
      };
    }
  }catch(e){ /* no existing data yet, or storage unavailable */ }
  return { entries: [], budget: null, customCategories: [], hiddenDefaultCategories: [], balance: null, balanceSetAt: null, receivables: [], payables: [] };
}

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    showToast('No se pudo guardar. Revisa el espacio de Safari.');
  }
}

function showToast(msg){
  hideUndo();
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.hidden = true, 2600);
}

let pendingRestore = null;
let undoTimer = null;

function showUndo(restoreFn){
  document.getElementById('toast').hidden = true;
  clearTimeout(undoTimer);
  pendingRestore = restoreFn;
  document.getElementById('undoPill').hidden = false;
  undoTimer = setTimeout(hideUndo, 5000);
}
function hideUndo(){
  document.getElementById('undoPill').hidden = true;
  pendingRestore = null;
  clearTimeout(undoTimer);
}
document.getElementById('undoAction').addEventListener('click', async () => {
  if(!pendingRestore) return;
  const fn = pendingRestore;
  hideUndo();
  await fn();
});
document.getElementById('undoCloseBtn').addEventListener('click', hideUndo);

function entriesForViewMonth(){
  const prefix = `${viewYear}-${pad(viewMonth+1)}`;
  return data.entries.filter(e => e.date.startsWith(prefix));
}

function getFilteredSortedEntries(monthEntries){
  let list = filterCategory === 'all' ? monthEntries.slice() : monthEntries.filter(e => e.category === filterCategory);
  if(sortMode === 'date-desc') list.sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  else if(sortMode === 'date-asc') list.sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  else if(sortMode === 'amount-desc') list.sort((a,b)=> b.amount - a.amount);
  else if(sortMode === 'amount-asc') list.sort((a,b)=> a.amount - b.amount);
  return list;
}

function getMonthRange(){
  const keys = new Set();
  data.entries.forEach(e => keys.add(e.date.slice(0,7)));
  keys.add(`${today.getFullYear()}-${pad(today.getMonth()+1)}`);
  keys.add(`${viewYear}-${pad(viewMonth+1)}`);
  const sorted = Array.from(keys).sort();
  let [y,m] = sorted[0].split('-').map(Number);
  const [maxY,maxM] = sorted[sorted.length-1].split('-').map(Number);
  const list = [];
  while(y < maxY || (y===maxY && m<=maxM)){
    list.push(`${y}-${pad(m)}`);
    m++; if(m>12){ m=1; y++; }
  }
  return list.reverse();
}

function renderMonthSelect(){
  const sel = document.getElementById('monthSelect');
  const currentValue = `${viewYear}-${pad(viewMonth+1)}`;
  sel.innerHTML = getMonthRange().map(key => {
    const [y,m] = key.split('-').map(Number);
    return `<option value="${key}" ${key===currentValue?'selected':''}>${MONTH_NAMES[m-1]} ${y}</option>`;
  }).join('');
}

function render(){
  renderBalance();
  renderMonthSelect();

  const monthEntries = entriesForViewMonth();
  const total = monthEntries.reduce((s,e)=> s + e.amount, 0);
  document.getElementById('totalAmount').textContent = fmt.format(total);

  renderBudgetStatus(total);
  renderCategoryChart(monthEntries, total);
  renderDues();
  renderFilterChips();
  renderEntries(getFilteredSortedEntries(monthEntries));
}

function renderBalance(){
  const el = document.getElementById('balanceAmount');
  const remaining = computeRemainingBalance();
  if(remaining == null){
    el.textContent = 'Sin definir';
    el.style.color = 'var(--text-muted)';
  } else {
    el.textContent = fmt.format(remaining);
    el.style.color = remaining < 0 ? 'var(--negative)' : 'var(--text)';
  }
}

function renderBudgetStatus(total){
  const wrap = document.getElementById('budgetStatusWrap');
  if(data.budget && data.budget > 0){
    const pct = Math.min(100, Math.round((total / data.budget) * 100));
    const over = total > data.budget;
    const remaining = data.budget - total;
    wrap.innerHTML = `
      <div class="budget-status">
        <div class="budget-bar-track"><div class="budget-bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
        <span class="budget-text ${over?'over':''}">
          ${over ? `Te pasaste por ${fmt.format(Math.abs(remaining))}` : `Te quedan ${fmt.format(remaining)} de ${fmt.format(data.budget)}`}
        </span>
      </div>`;
  } else {
    wrap.innerHTML = '';
  }
}

function renderCategoryChart(monthEntries, total){
  const container = document.getElementById('categoryChart');
  if(monthEntries.length === 0){ container.innerHTML = ''; return; }

  const sums = {};
  monthEntries.forEach(e => { sums[e.category] = (sums[e.category]||0) + e.amount; });
  const rows = Object.entries(sums)
    .sort((a,b)=> b[1]-a[1])
    .map(([catId, amt]) => ({ cat: catInfo(catId), amt }));
  const maxAmt = rows[0].amt;

  const width = 320, height = 92, topPad = 20, gap = 10;
  const barWidth = (width - (rows.length-1)*gap) / rows.length;
  let bars = '';
  rows.forEach((r, i) => {
    const pct = total ? Math.round((r.amt/total)*100) : 0;
    const barH = maxAmt>0 ? (r.amt/maxAmt) * (height-topPad) : 0;
    const x = i*(barWidth+gap);
    const y = height - barH;
    bars += `
      <text x="${(x+barWidth/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" class="chart-bar-label">${pct}%</text>
      <rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barWidth.toFixed(2)}" height="${barH.toFixed(2)}" rx="4" style="fill:${r.cat.color}">
        <title>${r.cat.label}: ${fmt.format(r.amt)} (${pct}%)</title>
      </rect>`;
  });

  const legend = rows.map(r => {
    const pct = total ? Math.round((r.amt/total)*100) : 0;
    return `
      <div class="breakdown-item">
        <div class="breakdown-row">
          <span class="cat-dot" style="background:${r.cat.color}"></span>
          <span class="breakdown-label">${r.cat.label}</span>
          <span class="breakdown-pct">${pct}% · ${fmt.format(r.amt)}</span>
        </div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="chart-label">Gasto por categoría</div>
    <svg viewBox="0 0 ${width} ${height}" class="daily-chart-svg" preserveAspectRatio="none">${bars}</svg>
    <div class="chart-legend">${legend}</div>`;
}

function applyChipColors(container){
  container.querySelectorAll('[data-color]').forEach(chip => {
    if(chip.getAttribute('aria-pressed') === 'true'){
      chip.style.background = chip.getAttribute('data-color');
      chip.style.borderColor = chip.getAttribute('data-color');
      chip.style.color = 'var(--accent-text)';
    } else {
      chip.style.background = '';
      chip.style.borderColor = '';
      chip.style.color = '';
    }
  });
}

function renderFilterChips(){
  const wrap = document.getElementById('filterChips');
  const cats = allCategories();
  wrap.innerHTML = `<button type="button" class="filter-chip" data-filter="all" aria-pressed="${filterCategory==='all'}">Todas</button>` +
    cats.map(c => `<button type="button" class="filter-chip" data-filter="${c.id}" data-color="${c.color}" aria-pressed="${filterCategory===c.id}">${c.label}</button>`).join('');
  applyChipColors(wrap);
  wrap.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filterCategory = chip.getAttribute('data-filter');
      render();
    });
  });
}

function renderEntries(list){
  const container = document.getElementById('entriesList');
  const empty = document.getElementById('emptyState');
  if(list.length === 0){
    container.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  const groupByDay = sortMode === 'date-desc' || sortMode === 'date-asc';

  if(groupByDay){
    const byDay = {};
    const order = [];
    list.forEach(e => {
      if(!byDay[e.date]){ byDay[e.date] = []; order.push(e.date); }
      byDay[e.date].push(e);
    });
    container.innerHTML = order.map(date => {
      const d = new Date(date + 'T00:00:00');
      const heading = `${d.getDate()} de ${MONTH_NAMES[d.getMonth()]}`;
      const rows = byDay[date].map(e => entryRowHtml(e, false)).join('');
      return `<div class="day-group"><div class="day-heading">${heading}</div>${rows}</div>`;
    }).join('');
  } else {
    container.innerHTML = list.map(e => entryRowHtml(e, true)).join('');
  }

  container.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', (ev) => { ev.stopPropagation(); deleteEntry(btn.getAttribute('data-delete')); });
  });
  container.querySelectorAll('.entry-row').forEach(row => {
    row.addEventListener('click', () => {
      const entry = data.entries.find(e => e.id === row.getAttribute('data-id'));
      if(entry) openEntrySheet(entry);
    });
  });
}

function entryRowHtml(e, showDate){
  const cat = catInfo(e.category);
  const d = new Date(e.date + 'T00:00:00');
  const dateLabel = `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)}`;
  return `
    <div class="entry-row" data-id="${e.id}">
      <div class="entry-left">
        <span class="cat-dot" style="background:${cat.color}"></span>
        <div class="entry-text">

function makeSheetDraggable(handle, sheet, onDismiss){
  let startY = 0, dy = 0, dragging = false;
  function onDown(e){
    dragging = true;
    startY = e.clientY;
    dy = 0;
    sheet.style.transition = 'none';
    try{ handle.setPointerCapture(e.pointerId); }catch(err){ /* ignore */ }
  }
  function onMove(e){
    if(!dragging) return;
    dy = Math.max(0, e.clientY - startY);
    sheet.style.transform = `translateY(${dy}px)`;
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform 0.22s ease';
    const threshold = Math.min(120, sheet.offsetHeight * 0.25);
    if(dy > threshold){
      sheet.style.transform = 'translateY(100%)';
      setTimeout(() => {
        onDismiss();
        sheet.style.transition = '';
        sheet.style.transform = '';
      }, 200);
    } else {
      sheet.style.transform = 'translateY(0)';
    }
  }
  handle.addEventListener('pointerdown', onDown);
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onUp);
}

    const idx = data.entries.findIndex(x => x.id === editingId);
    if(idx > -1) data.entries[idx] = { ...data.entries[idx], amount, category: selectedCategory, note, date };
  } else {
    data.entries.push({
      id: `${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
      amount, category: selectedCategory, note, date

  }

function renderManageCategories(){
  const list = document.getElementById('manageCategoriesList');
  list.innerHTML = allCategories().map(c => {
    const count = data.entries.filter(e => e.category === c.id).length;
    const canDelete = c.id !== 'otro';
    return `
      <div class="manage-row">
        <span class="cat-dot" style="background:${c.color}"></span>
        <span class="manage-label">${c.label}</span>
        <span class="manage-count">${count > 0 ? count + (count===1?' gasto':' gastos') : ''}</span>
        ${canDelete ? `<button class="delete-btn" data-delcat="${c.id}" aria-label="Eliminar categoría ${c.label}">×</button>` : ''}
      </div>`;
  }).join('');
  list.querySelectorAll('[data-delcat]').forEach(btn => {
    btn.addEventListener('click', () => deleteCategory(btn.getAttribute('data-delcat')));
  });
}

async function deleteCategory(id){
  const cat = catInfo(id);
  const count = data.entries.filter(e => e.category === id).length;
  const msg = count > 0
    ? `¿Eliminar "${cat.label}"? ${count} ${count===1?'gasto se moverá':'gastos se moverán'} a "Otro".`
    : `¿Eliminar la categoría "${cat.label}"?`;
  if(!window.confirm(msg)) return;

  const affectedIds = data.entries.filter(e => e.category === id).map(e => e.id);
  const wasDefault = CATEGORIES.some(c => c.id === id);
  const removedCustom = wasDefault ? null : data.customCategories.find(c => c.id === id);

  data.entries.forEach(e => { if(e.category === id) e.category = 'otro'; });
  if(wasDefault){
    data.hiddenDefaultCategories = data.hiddenDefaultCategories || [];
    data.hiddenDefaultCategories.push(id);
  } else {
    data.customCategories = data.customCategories.filter(c => c.id !== id);
  }
  if(filterCategory === id) filterCategory = 'all';
  renderManageCategories();
  render();
  await saveData();
  showUndo(async () => {
    if(wasDefault){
      data.hiddenDefaultCategories = data.hiddenDefaultCategories.filter(h => h !== id);
    } else if(removedCustom){
      data.customCategories.push(removedCustom);
    }
    data.entries.forEach(e => { if(affectedIds.includes(e.id)) e.category = id; });
    renderManageCategories();
    render();
    await saveData();
  });
}

function renderDues(){
  renderDueList('receivableList', 'receivableHistory', 'receivableHistorySummary', data.receivables, 'receivable');
  renderDueList('payableList', 'payableHistory', 'payableHistorySummary', data.payables, 'payable');
  document.getElementById('receivableTotal').textContent = fmt.format(data.receivables.filter(d=>!d.settled).reduce((s,d)=>s+d.amount,0));
  document.getElementById('payableTotal').textContent = fmt.format(data.payables.filter(d=>!d.settled).reduce((s,d)=>s+d.amount,0));
}

function dueRowHtml(d, isSettled){
  return `
    <div class="due-row">
      <div class="due-left">
        <div class="due-desc${isSettled?' muted-strike':''}">${escapeHtml(d.desc)}</div>
        ${d.person ? `<div class="due-person">${escapeHtml(d.person)}</div>` : ''}
        ${isSettled ? `<div class="due-person">${formatShortDate(d.settledDate)}</div>` : ''}
      </div>
      <div class="due-right">
        <span class="due-amount${isSettled?' muted-strike':''}">${fmt.format(d.amount)}</span>
        ${isSettled
          ? `<button class="due-check" data-reactivate="${d.id}" aria-label="Reactivar">↺</button>`
          : `<button class="due-check" data-resolve="${d.id}" aria-label="Marcar como resuelto">✓</button>`}
        <button class="delete-btn" data-deldue="${d.id}" aria-label="Eliminar">×</button>
      </div>
    </div>`;
}

function formatShortDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)}`;
}

function renderDueList(pendingId, historyId, summaryId, list, kind){
  const pending = list.filter(d => !d.settled);
  const settled = list.filter(d => d.settled).sort((a,b) => (b.settledDate||'').localeCompare(a.settledDate||''));

  const pendingEl = document.getElementById(pendingId);
  pendingEl.innerHTML = pending.length
    ? pending.map(d => dueRowHtml(d, false)).join('')
    : `<div class="dues-empty">Nada pendiente</div>`;

  document.getElementById(summaryId).textContent = `Historial (${settled.length})`;
  const historyEl = document.getElementById(historyId);
  historyEl.innerHTML = settled.length
    ? settled.map(d => dueRowHtml(d, true)).join('')
    : `<div class="dues-empty">Sin historial todavía</div>`;

  [pendingEl, historyEl].forEach(container => {
    container.querySelectorAll('[data-resolve]').forEach(btn => {
      btn.addEventListener('click', () => resolveDue(kind, btn.getAttribute('data-resolve')));
    });
    container.querySelectorAll('[data-reactivate]').forEach(btn => {
      btn.addEventListener('click', () => reactivateDue(kind, btn.getAttribute('data-reactivate')));
    });
    container.querySelectorAll('[data-deldue]').forEach(btn => {
      btn.addEventListener('click', () => deleteDue(kind, btn.getAttribute('data-deldue')));
    });
  });
}

async function resolveDue(kind, id){
  const key = kind === 'receivable' ? 'receivables' : 'payables';
  const item = data[key].find(d => d.id === id);
  if(!item) return;
  item.settled = true;
  item.settledDate = todayISO();
  renderDues();
  await saveData();
  showUndo(async () => {
    item.settled = false;
    item.settledDate = null;
    renderDues();
    await saveData();
  });
}

async function reactivateDue(kind, id){
  const key = kind === 'receivable' ? 'receivables' : 'payables';
  const item = data[key].find(d => d.id === id);
  if(!item) return;
  item.settled = false;
  item.settledDate = null;
  renderDues();
  await saveData();
  showToast(kind === 'receivable' ? 'Vuelve a estar pendiente por cobrar' : 'Vuelve a estar pendiente por pagar');
}

async function deleteDue(kind, id){
  const key = kind === 'receivable' ? 'receivables' : 'payables';
  const idx = data[key].findIndex(d => d.id === id);
  if(idx === -1) return;
  const [removed] = data[key].splice(idx, 1);
  renderDues();
  await saveData();
  showUndo(async () => {
    data[key].splice(idx, 0, removed);
    renderDues();
    await saveData();
  });
}
